name: Build RunPod image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache
          docker system prune -af
          df -h

      - name: Set image name
        shell: bash
        run: |
          REPOSITORY="${GITHUB_REPOSITORY,,}"
          echo "IMAGE=ghcr.io/${REPOSITORY}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:build-${{ github.run_number }}

      - name: Show RunPod image name
        run: |
          echo "Paste this into RunPod Container Image:"
          echo "${IMAGE}:build-${GITHUB_RUN_NUMBER}"
